[project]
name = "kryptamet"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "OrangeSorbet", email = "ashvij.patil@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "cryptography>=50.0.1",
    "flask>=3.1.3",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "pyperclip>=1.11.0",
    "pyqt6>=6.11.0",
    "scikit-learn>=1.9.1",
    "tenseal>=0.3.18",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "yfinance>=1.7.0",
]

[project.scripts]
kryptamet = "kryptamet:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
