{% if result %}
<div class="card">
    <div class="title" style="font-size: var(--font-size-lg);">Result: {{ result.dataset }}</div>
    <div class="result-row"><span>True label</span><span>{{ result.true_label }}</span></div>
    <div class="result-row"><span>Plaintext prediction</span><span>{{ result.plain_pred }}</span></div>
    <div class="result-row"><span>Encrypted (HE) prediction</span><span>{{ result.he_pred }}</span></div>
    <div class="result-row">
        <span>Match</span>
        <span class="{{ 'badge-match' if result.match else 'badge-mismatch' }}">{{ result.match }}</span>
    </div>
</div>
{% endif %}
