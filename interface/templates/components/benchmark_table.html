{% if benchmarks %}
<div class="card">
    <div class="title" style="font-size: var(--font-size-lg);">Benchmarks</div>
    <table class="benchmark-table">
        <tr><th>Model</th><th>Plaintext (s)</th><th>HE (s)</th><th>Slowdown</th><th>Agreement</th></tr>
        {% for b in benchmarks %}
        <tr>
            <td>{{ b.model }}</td>
            <td>{{ "%.4f"|format(b.plaintext_time_sec) }}</td>
            <td>{{ "%.4f"|format(b.he_time_sec) }}</td>
            <td>{{ "%.1f"|format(b.slowdown_factor) }}x</td>
            <td>{{ b.plain_vs_he_agreement }}</td>
        </tr>
        {% endfor %}
    </table>
</div>
{% endif %}
